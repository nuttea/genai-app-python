name: Datadog Code Security

# ── Trigger design ────────────────────────────────────────────────────────────
# Generic CI approach — native binaries only, no Docker, no Datadog GitHub Actions.
# Docs: https://docs.datadoghq.com/security/code_security/static_analysis/setup/generic_ci_providers/
#       https://docs.datadoghq.com/security/code_security/software_composition_analysis/setup_static/generic_ci_providers/
#
# Single job mirrors the Jenkins pipeline structure:
#   1. SAST Scan          — native datadog-static-analyzer binary, produces SARIF
#   2. Quality Gate       — quality_gate.py parses SARIF, enforces threshold
#   3. SARIF → GitHub     — uploads SARIF to GitHub Code Scanning (always)
#   4. SARIF → Datadog    — datadog-ci sarif upload (push/workflow_dispatch only)
#   5. SCA  → Datadog     — sbom-generator + datadog-ci sbom upload (push/workflow_dispatch only)
#
# Using a single job avoids running the static analyzer twice (once for the
# gate and once for the Datadog upload) by sharing the SARIF within the job.
#
# Datadog upload steps are skipped on pull_request triggers per Datadog docs:
#   "only supports workflows triggered by direct code commits (push event)"
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      severity_threshold:
        description: 'Quality gate blocking threshold (CRITICAL | HIGH | MEDIUM | LOW)'
        default: CRITICAL
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tool versions — update here to upgrade all downstream references
env:
  STATIC_ANALYZER_VERSION: '0.8.6'
  DATADOG_CI_VERSION: '2.45.1'
  SBOM_GENERATOR_VERSION: '1.14.0'
  SARIF_FILE: 'static-analysis-results.sarif'

jobs:
  code-security:
    name: Datadog Code Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to GitHub Code Scanning

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # ── 2. SAST Scan ─────────────────────────────────────────────────────────
      # Downloads the native Linux x86_64 binary and runs it against the workspace.
      - name: Run Datadog Static Analyzer — generate SARIF
        run: |
          curl -fsSL \
            "https://github.com/DataDog/datadog-static-analyzer/releases/download/${STATIC_ANALYZER_VERSION}/datadog-static-analyzer-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/ddog-analyzer.zip
          unzip /tmp/ddog-analyzer.zip -d /tmp/ddog-analyzer
          chmod +x /tmp/ddog-analyzer/datadog-static-analyzer

          /tmp/ddog-analyzer/datadog-static-analyzer \
            -i "$GITHUB_WORKSPACE" \
            -o "$GITHUB_WORKSPACE/${SARIF_FILE}" \
            -f sarif

          test -f "${SARIF_FILE}" || (echo "::error::SARIF not produced"; exit 1)
          echo "SARIF produced: $(wc -c < ${SARIF_FILE}) bytes"

      # ── 3. Quality Gate ───────────────────────────────────────────────────────
      # Mode and threshold are driven by repository variables (Settings → Variables):
      #   DETECT_ONLY=true              → virtual-fail: findings logged, CI never blocked
      #   DETECT_ONLY=false (default)   → block mode: exits non-zero on violations
      #   GATE_SEVERITY_THRESHOLD       → severity level that triggers the gate
      #
      # Priority for threshold: workflow_dispatch input → repo variable → built-in default
      - name: Evaluate Quality Gate
        env:
          DETECT_ONLY: ${{ vars.DETECT_ONLY }}
          GATE_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold || vars.GATE_SEVERITY_THRESHOLD }}
          SARIF_PATH: ${{ env.SARIF_FILE }}
        run: |
          if [ "$DETECT_ONLY" = "true" ]; then
            python3 .github/scripts/quality_gate.py --detect-only
          else
            python3 .github/scripts/quality_gate.py
          fi

      # ── 4. Upload SARIF to GitHub Code Scanning ───────────────────────────────
      # Runs even when the quality gate fails so annotations appear on the PR.
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f  # v4.36.2
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          category: datadog-sast

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: datadog-sast-sarif-${{ github.sha }}
          path: ${{ env.SARIF_FILE }}
          retention-days: 30

      # ── 5. Install datadog-ci (push / workflow_dispatch only) ─────────────────
      # Skipped on pull_request — Datadog's platform only indexes push events.
      - name: Install datadog-ci
        if: >-
          always() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm install -g "@datadog/datadog-ci@${DATADOG_CI_VERSION}"

      # ── 6. SAST → Datadog Upload ──────────────────────────────────────────────
      # Reuses the SARIF produced in step 2 — no second scan needed.
      - name: SAST → Datadog Upload
        if: >-
          always() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: datadoghq.com
        run: |
          # Upload git metadata — enables diff-aware scanning and PR commit linking in Datadog
          datadog-ci git-metadata upload

          datadog-ci sarif upload "${SARIF_FILE}" \
            --service "${{ github.event.repository.name }}" \
            --env "${{ github.ref_name }}"

      # ── 7. SCA → Datadog Upload ───────────────────────────────────────────────
      - name: SCA → Datadog Upload
        if: >-
          always() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: datadoghq.com
        run: |
          curl -fsSL \
            "https://github.com/DataDog/datadog-sbom-generator/releases/download/v${SBOM_GENERATOR_VERSION}/datadog-sbom-generator_linux_amd64.zip" \
            -o /tmp/datadog-sbom-generator.zip
          unzip /tmp/datadog-sbom-generator.zip -d /tmp/datadog-sbom-generator-dir
          chmod +x /tmp/datadog-sbom-generator-dir/datadog-sbom-generator

          /tmp/datadog-sbom-generator-dir/datadog-sbom-generator -p "$GITHUB_WORKSPACE" -o /tmp/sbom.json

          datadog-ci sbom upload /tmp/sbom.json \
            --service "${{ github.event.repository.name }}" \
            --env "${{ github.ref_name }}"
